<!doctype html>
<!-- Swagger UI sobre el contrato OpenAPI de la API (/openapi.yaml), servido desde el WebJar de swagger-ui -->
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cocos Challenge API</title>
	<link rel="icon" type="image/png" href="/webjars/swagger-ui/favicon-32x32.png">
	<link rel="stylesheet" href="/webjars/swagger-ui/swagger-ui.css">
</head>
<body>
	<div id="swagger-ui"></div>
	<script src="/webjars/swagger-ui/swagger-ui-bundle.js"></script>
	<script src="/webjars/swagger-ui/swagger-ui-standalone-preset.js"></script>
	<script>
		window.ui = SwaggerUIBundle({
			url: '/openapi.yaml',
			dom_id: '#swagger-ui',
			presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
			layout: 'StandaloneLayout',
			deepLinking: true,
			tryItOutEnabled: true
		});
	</script>
</body>
</html>
