spring.application.name=challenge

# Base de datos provista por el challenge; credenciales por variables de entorno
# o en un archivo .env local (no versionado)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema ya existe en la base provista; Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
