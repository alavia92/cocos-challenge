spring.application.name=challenge

# Base de datos provista por el challenge; credenciales por variables de entorno
# o en un archivo .env local (no versionado)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# La base ya existe con datos: Flyway la toma como versión 1 (esquema original) y aplica las migraciones siguientes
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# El esquema lo gestiona Flyway; Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
